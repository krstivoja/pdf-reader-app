[package]
name = "pdf-reader"
version = "0.1.0"
description = "Local PDF and EPUB audiobook reader powered by Kokoro TTS"
edition = "2021"

[lib]
name = "pdf_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
