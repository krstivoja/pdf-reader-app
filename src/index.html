<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Reader</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --ink: #e8eaed; --muted: #9aa0aa;
    --accent: #6ea8fe; --line: #262b34; --ok: #4ade80; --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex;
    align-items: center; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  .status { font-size: 13px; color: var(--muted); margin-left: auto; }
  .status.ok { color: var(--ok); } .status.warn { color: var(--warn); }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button, input {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 11px; font-size: 14px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #06223f; border-color: var(--accent); font-weight: 600; }
  button.active { border-color: var(--accent); color: var(--accent); }
  main { flex: 1; display: flex; overflow: hidden; }
  #library {
    width: 238px; flex: 0 0 238px; padding: 14px 10px; border-right: 1px solid var(--line);
    background: var(--panel); overflow-y: auto;
  }
  .library-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 12px; }
  .library-title { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .library-title span { color: var(--accent); }
  #addPdf { padding: 4px 8px; font-size: 12px; }
  .library-empty { padding: 10px 4px; color: var(--muted); font-size: 12px; }
  .book-row { display: flex; margin-bottom: 5px; border: 1px solid transparent; border-radius: 8px; }
  .book-row:hover { border-color: var(--line); }
  .book-row.active { border-color: var(--accent); background: #6ea8fe12; }
  .book-open {
    min-width: 0; flex: 1; display: flex; gap: 9px; align-items: center;
    padding: 8px; border: 0; background: transparent; text-align: left;
  }
  .book-cover { width: 40px; height: 54px; flex: 0 0 40px; border-radius: 3px; object-fit: cover; background: #20242c; }
  .book-cover.placeholder {
    display: flex; align-items: center; justify-content: center; color: var(--muted);
    font-size: 9px; font-weight: 700; letter-spacing: .04em;
  }
  .book-details { min-width: 0; }
  .book-open strong, .book-details span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-open strong { color: var(--ink); font-size: 13px; }
  .book-open span { margin-top: 3px; color: var(--muted); font-size: 11px; }
  .book-remove { align-self: center; padding: 2px 6px; border: 0; background: transparent; color: var(--muted); font-size: 18px; }
  .book-remove:hover { color: var(--warn); }
  #drop {
    flex: 1; margin: 18px; border: 2px dashed var(--line); border-radius: 14px;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 10px; color: var(--muted); text-align: center; transition: .15s;
  }
  #drop.drag { border-color: var(--accent); background: #6ea8fe11; color: var(--ink); }
  #drop.hidden { display: none; }
  #reader { flex: 1; min-width: 0; display: none; flex-direction: column; overflow: hidden; }
  #reader.show { display: flex; }
  .reader-nav {
    padding: 10px 18px; border-bottom: 1px solid var(--line); display: flex;
    gap: 10px; align-items: center; justify-content: center; background: var(--panel);
  }
  .reader-nav select { max-width: 220px; }
  .page-count { min-width: 92px; color: var(--muted); text-align: center; font-size: 13px; }
  .reader-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }
  #thumbnails {
    width: 136px; flex: 0 0 136px; padding: 14px 10px; border-right: 1px solid var(--line);
    background: var(--panel); overflow-y: auto;
  }
  .page-thumbnail {
    position: relative; width: 100%; margin: 0 0 10px; padding: 6px; border-color: transparent;
    background: transparent; color: var(--muted); font-size: 11px; text-align: center;
  }
  .thumbnail-bookmark {
    position: absolute; top: 8px; right: 8px; padding: 1px 4px; border-radius: 8px;
    background: #0f1115cc; color: var(--warn); font-size: 12px;
  }
  .page-thumbnail:hover { border-color: var(--line); }
  .page-thumbnail.active { border-color: var(--accent); background: #6ea8fe12; color: var(--ink); }
  .page-thumbnail img {
    display: block; width: 100%; margin-bottom: 5px; border-radius: 2px; background: white;
  }
  .page-thumbnail small {
    display: -webkit-box; margin-top: 3px; overflow: hidden; color: var(--muted);
    font-size: 10px; line-height: 1.2; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  }
  .thumbnail-placeholder {
    display: flex; min-height: 118px; margin-bottom: 5px; align-items: center; justify-content: center;
    border-radius: 2px; background: #20242c; color: var(--muted);
  }
  #pageScroll { flex: 1; min-width: 0; overflow-y: auto; padding: 28px 36px; }
  #text { max-width: 820px; margin: 0 auto; }
  .book-page {
    min-height: 100%; padding: 42px 52px; border: 1px solid var(--line);
    border-radius: 8px; background: #14171d; box-shadow: 0 8px 30px #00000024;
  }
  .page-kicker { margin-bottom: 28px; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .chapter-heading { margin: 0 0 24px; color: var(--ink); font-size: 26px; line-height: 1.25; }
  .book-page p { margin: 0 0 16px; }
  .sent { padding: 1px 2px; border-radius: 3px; transition: background .1s; }
  .sent.active { background: var(--accent); color: #06223f; }
  .row { display: flex; gap: 8px; align-items: center; }
  label { font-size: 13px; color: var(--muted); }
  input[type=range] { padding: 0; }
</style>
</head>
<body>
<header>
	  <h1>📖 PDF + EPUB Reader</h1>
  <div class="controls">
    <select id="voice" title="Voice"></select>
    <div class="row"><label>Speed</label>
      <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" style="width:88px">
      <span id="speedVal">1.0×</span>
    </div>
    <button id="play" class="primary" disabled>▶ Play</button>
    <button id="pause" disabled>⏸ Pause</button>
    <button id="stop" disabled>⏹ Stop</button>
	    <button id="new">New Book</button>
  </div>
  <div class="status" id="status">Checking Kokoro…</div>
</header>
<main>
  <aside id="library">
    <div class="library-head">
      <div class="library-title">Library <span id="libraryCount">0</span></div>
      <button id="addPdf">+ Add</button>
    </div>
	    <div id="bookList"><div class="library-empty">Imported PDFs and EPUBs will appear here.</div></div>
  </aside>
  <div id="drop">
    <div style="font-size:42px">⬇</div>
	    <div style="font-size:18px;color:var(--ink)">Drag &amp; drop a PDF or EPUB here</div>
    <div>or click to choose · text extracted locally, nothing uploaded</div>
	    <input type="file" id="file" accept=".pdf,.epub,application/pdf,application/epub+zip" hidden>
  </div>
  <div id="reader">
    <div class="reader-nav">
      <button id="prevPage" disabled>‹ Prev</button>
	      <span class="page-count"><span id="pageUnit">Page</span> <strong id="pageCurrent">0</strong> / <span id="pageTotal">0</span></span>
      <button id="nextPage" disabled>Next ›</button>
      <button id="bookmarkPage" title="Bookmark this page" disabled>☆ Bookmark</button>
      <select id="bookmark" title="Jump to bookmark" disabled><option>No bookmarks yet</option></select>
      <select id="chapter" title="Jump to chapter" disabled><option>No chapters detected</option></select>
    </div>
    <div class="reader-body">
      <aside id="thumbnails" aria-label="Page thumbnails"></aside>
      <div id="pageScroll"><div id="text"></div></div>
    </div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
